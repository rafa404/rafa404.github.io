name: Link Check

on:
  push:
    paths:
      - '.github/workflows/link-check.yml'
      - 'src/**'
      - 'public/**'
      - '*.md'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '^http://127\.0\.0\.1'
            --exclude '^https://doi\.org/\$\{publication\.doi\}'
            --exclude '^https://www\.sciencedirect\.com/'
            --exclude '^https://www\.scimagojr\.com/'
            './**/*.astro' './**/*.ts' './**/*.md'
          fail: true
